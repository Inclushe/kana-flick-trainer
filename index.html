<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Kana Flick Trainer</title>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import React from "https://esm.sh/react@latest";
import ReactDOM from "https://esm.sh/react-dom@latest";
import { createRoot as __clientCreateRoot } from "https://esm.sh/react-dom@latest/client";

const { useState, useEffect, useRef, useCallback } = React;

// Persist progress using localStorage (stands in for the host app's window.storage).
if (!window.storage) {
  window.storage = {
    async get(k) { try { const v = localStorage.getItem(k); return v == null ? null : { value: v }; } catch (e) { return null; } },
    async set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} return { value: v }; },
    async remove(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
}

// Inline icons (replacing lucide-react) so React/ReactDOM are the only dependencies.
function Eye({ size = 24 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
  );
}
function EyeOff({ size = 24 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
      <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
      <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
      <line x1="2" x2="22" y1="2" y2="22" />
    </svg>
  );
}


/*
  Kana Flick Trainer
  A touch-typing course for the Japanese kana (flick) keyboard on iOS / Android.
  You type on your phone's own kana keyboard; the app shows targets, captures
  what you actually type, checks it, and tracks accuracy + speed.

  Per key, the stages are:
    Learn -> Single flicks -> Transitions -> Typing test (untimed) -> Timed test
  All stages are unlocked and switchable. The flick reference is hidden during
  runs by default; an icon toggle on the page reveals it.
*/

// ---- Data -----------------------------------------------------------------
const KEYS = [
  { id: "a",  label: "あ", dirs: { center: ["あ"], left: ["い"], up: ["う"], right: ["え"], down: ["お"] } },
  { id: "ka", label: "か", dirs: { center: ["か"], left: ["き"], up: ["く"], right: ["け"], down: ["こ"] } },
  { id: "sa", label: "さ", dirs: { center: ["さ"], left: ["し"], up: ["す"], right: ["せ"], down: ["そ"] } },
  { id: "ta", label: "た", dirs: { center: ["た"], left: ["ち"], up: ["つ"], right: ["て"], down: ["と"] } },
  { id: "na", label: "な", dirs: { center: ["な"], left: ["に"], up: ["ぬ"], right: ["ね"], down: ["の"] } },
  { id: "ha", label: "は", dirs: { center: ["は"], left: ["ひ"], up: ["ふ"], right: ["へ"], down: ["ほ"] } },
  { id: "ma", label: "ま", dirs: { center: ["ま"], left: ["み"], up: ["む"], right: ["め"], down: ["も"] } },
  { id: "ya", label: "や", dirs: { center: ["や"], left: ["「", "（"], up: ["ゆ"], right: ["」", "）"], down: ["よ"] } },
  { id: "ra", label: "ら", dirs: { center: ["ら"], left: ["り"], up: ["る"], right: ["れ"], down: ["ろ"] } },
  { id: "wa", label: "わ", dirs: { center: ["わ"], left: ["を"], up: ["ん"], right: ["ー"], down: ["〜"] } },
];
const KEY_BY_ID = Object.fromEntries(KEYS.map((k) => [k.id, k]));
const POS_ORDER = ["center", "left", "up", "right", "down"];
const POS_META = {
  center: { label: "Tap", arrow: "•" },
  left:   { label: "Flick left", arrow: "←" },
  up:     { label: "Flick up", arrow: "↑" },
  right:  { label: "Flick right", arrow: "→" },
  down:   { label: "Flick down", arrow: "↓" },
};

const STAGES = ["intro", "reps", "cycle", "transition", "testUntimed", "testTimed"];
const DRILL_STAGES = ["reps", "cycle", "transition", "testUntimed", "testTimed"];
const STAGE_LABEL = {
  intro: "Learn the key",
  reps: "Single flicks",
  cycle: "Flick cycle",
  transition: "Transitions",
  testUntimed: "Typing test",
  testTimed: "Timed test",
};
const TAB_LABEL = { intro: "Learn", reps: "Reps", cycle: "Cycle", transition: "Transition", testUntimed: "Test", testTimed: "Timed" };

const REPS_SINGLE = 4;
const UNTIMED_LEN = 36;
const TIMED_LEN = 600;
const TIMED_SECONDS = 60;
const TIMED_WINDOW = 40;
const STORE_KEY = "kana-flick-progress-v4";

const disp = (keyId, pos) => KEY_BY_ID[keyId].dirs[pos][0];
const fmtTime = (sec) => {
  const s = Math.max(0, Math.ceil(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

// progress helpers
const stageIsDone = (ks, s) => !!(ks && ks[s] && ks[s].done);
const keyIsDone = (ks) => DRILL_STAGES.every((s) => stageIsDone(ks, s));
const stagesDoneCount = (ks) => DRILL_STAGES.filter((s) => stageIsDone(ks, s)).length;
const keyStarted = (ks) =>
  !!ks && DRILL_STAGES.some((s) => ks[s] && (ks[s].done || (ks[s].idx || 0) > 0 || (ks[s].cursor || 0) > 0));

// ---- Generators -----------------------------------------------------------
function buildPrompts(stage, keyId) {
  if (stage === "reps") {
    // each character repeated REPS_SINGLE times (ああああ いいいい …)
    const out = [];
    for (const pos of POS_ORDER) for (let i = 0; i < REPS_SINGLE; i++) out.push({ steps: [{ keyId, pos }] });
    return out;
  }
  if (stage === "cycle") {
    // cycle through every character, REPS_SINGLE times (あいうえお ×4)
    const out = [];
    for (let i = 0; i < REPS_SINGLE; i++) for (const pos of POS_ORDER) out.push({ steps: [{ keyId, pos }] });
    return out;
  }
  // transition: every ordered pair of distinct characters, in order
  // (あい あう あえ あお / いあ いう … ; ああ etc. excluded — same key isn't a flick move)
  const out = [];
  for (const a of POS_ORDER) for (const b of POS_ORDER) if (a !== b) out.push({ steps: [{ keyId, pos: a }, { keyId, pos: b }] });
  return out;
}

function buildPassage(reviewKeyIds, len) {
  const out = [];
  let lastChar = null;
  const variety = reviewKeyIds.length * POS_ORDER.length;
  for (let i = 0; i < len; i++) {
    let kId, pos, ch;
    do {
      kId = reviewKeyIds[Math.floor(Math.random() * reviewKeyIds.length)];
      pos = POS_ORDER[Math.floor(Math.random() * POS_ORDER.length)];
      ch = disp(kId, pos);
    } while (ch === lastChar && variety > 1);
    lastChar = ch;
    out.push({ keyId: kId, pos });
  }
  return out;
}

// ---- Small components -----------------------------------------------------
function FlickGuide({ keyId, litPos }) {
  const k = KEY_BY_ID[keyId];
  const cell = (pos) => (
    <div className={"fg-cell" + (pos === "center" ? " fg-center" : "") + (pos === litPos ? " fg-lit" : "")}>
      <span className="fg-char">{k.dirs[pos].join(" ")}</span>
      <span className="fg-arrow">{POS_META[pos].arrow}</span>
    </div>
  );
  return (
    <div className="fg-wrap">
      <div className="fg-grid">
        <div /> {cell("up")} <div />
        {cell("left")} {cell("center")} {cell("right")}
        <div /> {cell("down")} <div />
      </div>
    </div>
  );
}

function GuideToggle({ on, onToggle }) {
  return (
    <button className="icon-btn" onClick={onToggle} aria-label={on ? "Hide flick guide" : "Show flick guide"} title={on ? "Hide guide" : "Show guide"}>
      {on ? <Eye size={18} /> : <EyeOff size={18} />}
    </button>
  );
}

// ---- Drill (single flicks + transitions) ----------------------------------
function Drill({ stage, keyId, showGuide, onToggleGuide, initial, isLast, hasNextLesson, onProgress, onNext, onExit }) {
  const [prompts, setPrompts] = useState(
    () => (initial && initial.prompts && initial.prompts.length ? initial.prompts : buildPrompts(stage, keyId))
  );
  const [idx, setIdx] = useState(() => (initial && !initial.done ? initial.idx || 0 : 0));
  const [sub, setSub] = useState(0);
  const [flash, setFlash] = useState(null);
  const [hits, setHits] = useState(() => (initial && initial.hits) || 0);
  const [errs, setErrs] = useState(() => (initial && initial.errs) || 0);
  const [done, setDone] = useState(() => !!(initial && initial.done));

  const inputRef = useRef(null);
  const handlerRef = useRef(() => {});
  const enterHandlerRef = useRef(() => {});
  const flashTimer = useRef(null);
  const elapsedBaseRef = useRef((initial && initial.elapsedMs) || 0);
  const sessionStartRef = useRef(null);

  const total = prompts.length;
  const current = prompts[Math.min(idx, total - 1)];

  const elapsedNow = () =>
    elapsedBaseRef.current + (sessionStartRef.current != null ? performance.now() - sessionStartRef.current : 0);
  const report = (over) =>
    onProgress({ prompts, idx: over.idx ?? idx, hits: over.hits ?? hits, errs: over.errs ?? errs, done: over.done ?? done, elapsedMs: elapsedNow() });
  const clearField = () => { if (inputRef.current) inputRef.current.value = ""; };
  const doFlash = (t) => { setFlash(t); clearTimeout(flashTimer.current); flashTimer.current = setTimeout(() => setFlash(null), 200); };

  handlerRef.current = () => {
    const el = inputRef.current;
    const raw = el ? el.value : "";
    if (/[\n\r]/.test(raw)) { clearField(); enterHandlerRef.current(); return; } // Enter
    if (done) { clearField(); return; } // ignore typing on the results screen
    const val = raw.trim();
    if (val.length === 0) return;
    if (sessionStartRef.current == null) sessionStartRef.current = performance.now();

    const expected = prompts[idx].steps.map((s) => KEY_BY_ID[s.keyId].dirs[s.pos]);
    const chars = Array.from(val);
    let m = 0, bad = false;
    for (let i = 0; i < chars.length; i++) {
      if (i < expected.length && expected[i].includes(chars[i])) m++;
      else { bad = true; break; }
    }
    if (bad) { const ne = errs + 1; setErrs(ne); setSub(0); doFlash("bad"); clearField(); report({ errs: ne }); return; }
    setSub(m);
    if (m === expected.length) {
      const nh = hits + expected.length, ni = idx + 1, fin = ni >= total;
      setHits(nh); setSub(0); doFlash("ok"); clearField();
      if (fin) setDone(true); else setIdx(ni);
      report({ hits: nh, idx: ni, done: fin });
    }
  };

  // Enter advances to the next stage from the results screen.
  enterHandlerRef.current = () => { if (done) ((isLast && !hasNextLesson) ? onExit() : onNext()); };

  useEffect(() => {
    const el = inputRef.current; if (!el) return;
    const onInput = () => handlerRef.current();
    const onKey = (e) => { if (e.key === "Enter") { e.preventDefault(); enterHandlerRef.current(); } };
    const onBeforeInput = (e) => {
      if (e.inputType === "insertLineBreak" || e.inputType === "insertParagraph") { e.preventDefault(); enterHandlerRef.current(); }
    };
    el.addEventListener("input", onInput);
    el.addEventListener("compositionupdate", onInput);
    el.addEventListener("keydown", onKey);
    el.addEventListener("beforeinput", onBeforeInput);
    el.focus();
    return () => {
      el.removeEventListener("input", onInput);
      el.removeEventListener("compositionupdate", onInput);
      el.removeEventListener("keydown", onKey);
      el.removeEventListener("beforeinput", onBeforeInput);
    };
  }, []);
  useEffect(() => () => clearTimeout(flashTimer.current), []);

  const restart = () => {
    const fresh = buildPrompts(stage, keyId);
    elapsedBaseRef.current = 0; sessionStartRef.current = null;
    setPrompts(fresh); setIdx(0); setSub(0); setHits(0); setErrs(0); setDone(false); clearField();
    onProgress({ prompts: fresh, idx: 0, hits: 0, errs: 0, done: false, elapsedMs: 0 });
    setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
  };

  const accuracy = hits + errs > 0 ? Math.round((hits / (hits + errs)) * 100) : 100;
  const secs = elapsedNow() / 1000;
  const cpm = secs > 0 ? Math.round((hits / secs) * 60) : 0;
  const stepChars = !done ? current.steps.map((s) => disp(s.keyId, s.pos)) : [];
  const curStep = !done ? current.steps[Math.min(sub, current.steps.length - 1)] : null;

  return (
    <div className={"drill " + (flash ? "flash-" + flash : "")}>
      {done ? (
        <ResultBody title={`${STAGE_LABEL[stage]} complete`}
          stats={[[`${accuracy}%`, "accuracy"], [cpm, "chars / min"], [errs, "misses"]]}
          warn={accuracy < 85 ? "Accuracy under 85% — worth another pass." : null}
          onRestart={restart} isLast={isLast} hasNextLesson={hasNextLesson} onNext={onNext} onExit={onExit} />
      ) : (
        <div className="drill-main">
          <div className="run-top">
            <span className="muted">{idx + 1} / {total}</span>
            <span className="run-top-right"><span className="muted">{accuracy}% acc</span><GuideToggle on={showGuide} onToggle={onToggleGuide} /></span>
          </div>
          <div className="progressbar"><div style={{ width: `${(idx / total) * 100}%` }} /></div>
          <div className="run-body drill-body">
            <div className="prompt">
              {stepChars.map((c, i) => (
                <span key={i} className="prompt-frag">
                  <span className={"target " + (i < sub ? "target-done" : i === sub ? "target-now" : "target-next")}>{c}</span>
                  {i < stepChars.length - 1 && <span className="prompt-arrow">→</span>}
                </span>
              ))}
            </div>
            <div className="muted sub-instr">{KEY_BY_ID[curStep.keyId].label} key · {POS_META[curStep.pos].label}</div>
            {showGuide && <FlickGuide keyId={curStep.keyId} />}
          </div>
        </div>
      )}
      <textarea ref={inputRef} className="capture" rows={1} autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} placeholder={done ? "press Enter to continue" : "type here…"} aria-label="type the target using your kana keyboard" />
    </div>
  );
}

// ---- Typing test (untimed + timed) ----------------------------------------
function TypingTest({ stage, reviewKeyIds, showGuide, onToggleGuide, initial, isLast, hasNextLesson, onProgress, onNext, onExit }) {
  const timed = stage === "testTimed";
  const [passage, setPassage] = useState(() =>
    (!timed && initial && initial.passage && initial.passage.length && !initial.done)
      ? initial.passage
      : buildPassage(reviewKeyIds, timed ? TIMED_LEN : UNTIMED_LEN)
  );
  const [cursor, setCursor] = useState(() => (!timed && initial && !initial.done ? initial.cursor || 0 : 0));
  const [errs, setErrs] = useState(() => (!timed && initial && !initial.done ? initial.errs || 0 : 0));
  const [started, setStarted] = useState(false);
  const [flash, setFlash] = useState(null);
  const [done, setDone] = useState(() => !!(initial && initial.done));
  const [result, setResult] = useState(() => (initial && initial.done ? initial.result : null));
  const [timeLeft, setTimeLeft] = useState(TIMED_SECONDS);
  const [winStart, setWinStart] = useState(0);
  const [errored, setErrored] = useState(false);
  const [errorChar, setErrorChar] = useState(null);

  const inputRef = useRef(null);
  const handlerRef = useRef(() => {});
  const deleteHandlerRef = useRef(() => {});
  const enterHandlerRef = useRef(() => {});
  const flashTimer = useRef(null);
  const tickRef = useRef(null);
  const startTsRef = useRef(null);
  const cursorRef = useRef(cursor);
  const errsRef = useRef(errs);
  cursorRef.current = cursor;
  errsRef.current = errs;

  const doFlashBad = () => { setFlash("bad"); clearTimeout(flashTimer.current); flashTimer.current = setTimeout(() => setFlash(null), 200); };
  const clearField = () => { if (inputRef.current) inputRef.current.value = ""; };

  const finishTimed = () => {
    if (tickRef.current) { clearInterval(tickRef.current); tickRef.current = null; }
    setTimeLeft(0);
    const chars = cursorRef.current, e = errsRef.current;
    const acc = chars + e > 0 ? Math.round((chars / (chars + e)) * 100) : 100;
    const cpm = Math.round(chars / (TIMED_SECONDS / 60));
    const res = { cpm, accuracy: acc, chars, errs: e };
    setResult(res); setDone(true);
    onProgress({ done: true, result: res });
  };

  const startTimer = () => {
    if (!timed || tickRef.current) return;
    startTsRef.current = performance.now();
    tickRef.current = setInterval(() => {
      const left = TIMED_SECONDS - (performance.now() - startTsRef.current) / 1000;
      if (left <= 0) finishTimed(); else setTimeLeft(left);
    }, 100);
  };

  handlerRef.current = () => {
    const el = inputRef.current;
    const raw = el ? el.value : "";
    if (/[\n\r]/.test(raw)) { clearField(); enterHandlerRef.current(); return; } // Enter
    if (done) { clearField(); return; } // ignore typing on the results screen
    const val = raw.trim();
    if (val.length === 0) return;
    if (errored) { clearField(); return; } // an error is pending — backspace to clear it first
    if (!started) { setStarted(true); startTimer(); }

    let c = cursor, e = errs, errCh = null;
    for (const t of Array.from(val)) {
      if (c >= passage.length) break;
      const accepted = KEY_BY_ID[passage[c].keyId].dirs[passage[c].pos];
      if (accepted.includes(t)) c++; else { e++; errCh = t; break; }
    }
    clearField();
    setCursor(c);

    if (errCh != null) {
      setErrs(e); setErrored(true); setErrorChar(errCh); doFlashBad();
      if (!timed) onProgress({ passage, cursor: c, errs: e, done: false, result: null });
      return;
    }
    if (!timed) {
      const fin = c >= passage.length;
      if (fin) {
        const acc = c + e > 0 ? Math.round((c / (c + e)) * 100) : 100;
        const res = { accuracy: acc, chars: c, errs: e };
        setDone(true); setResult(res);
        onProgress({ passage, cursor: c, errs: e, done: true, result: res });
      } else {
        onProgress({ passage, cursor: c, errs: e, done: false, result: null });
      }
    }
  };

  // Backspace clears a pending error. The field is wiped after every character,
  // so a normal delete produces no input event — we watch the key directly.
  deleteHandlerRef.current = () => {
    if (done) return;
    if (errored) { setErrored(false); setErrorChar(null); }
    clearField();
  };

  // Enter advances to the next stage from the results screen.
  enterHandlerRef.current = () => { if (done) ((isLast && !hasNextLesson) ? onExit() : onNext()); };

  useEffect(() => {
    const el = inputRef.current; if (!el) return;
    const fn = () => handlerRef.current();
    const onKey = (e) => {
      if (e.key === "Backspace") deleteHandlerRef.current();
      else if (e.key === "Enter") { e.preventDefault(); enterHandlerRef.current(); }
    };
    const onBeforeInput = (e) => {
      if (e.inputType === "deleteContentBackward") deleteHandlerRef.current();
      else if (e.inputType === "insertLineBreak" || e.inputType === "insertParagraph") { e.preventDefault(); enterHandlerRef.current(); }
    };
    el.addEventListener("input", fn);
    el.addEventListener("compositionupdate", fn);
    el.addEventListener("keydown", onKey);
    el.addEventListener("beforeinput", onBeforeInput);
    el.focus();
    return () => {
      el.removeEventListener("input", fn);
      el.removeEventListener("compositionupdate", fn);
      el.removeEventListener("keydown", onKey);
      el.removeEventListener("beforeinput", onBeforeInput);
    };
  }, []);
  useEffect(() => () => { clearTimeout(flashTimer.current); if (tickRef.current) clearInterval(tickRef.current); }, []);

  useEffect(() => {
    if (timed && cursor >= winStart + TIMED_WINDOW) setWinStart(cursor);
  }, [cursor]);

  const restart = () => {
    if (tickRef.current) { clearInterval(tickRef.current); tickRef.current = null; }
    const fresh = buildPassage(reviewKeyIds, timed ? TIMED_LEN : UNTIMED_LEN);
    setPassage(fresh);
    setCursor(0); setErrs(0); setStarted(false); setDone(false); setResult(null); setTimeLeft(TIMED_SECONDS); setWinStart(0); setErrored(false); setErrorChar(null); clearField();
    if (!timed) onProgress({ passage: fresh, cursor: 0, errs: 0, done: false, result: null });
    else onProgress({ done: false });
    setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
  };

  const accuracy = cursor + errs > 0 ? Math.round((cursor / (cursor + errs)) * 100) : 100;
  const showResult = done && result;
  const stats = !showResult ? null : (timed
    ? [[result.cpm, "chars / min"], [`${result.accuracy}%`, "accuracy"], [result.chars, "chars typed"]]
    : [[`${result.accuracy}%`, "accuracy"], [result.chars, "chars"], [result.errs, "misses"]]);

  const WINDOW = timed ? TIMED_WINDOW : passage.length;
  const start = timed ? winStart : 0;
  const slice = passage.slice(start, start + WINDOW);
  const guideKeyId = passage[Math.min(cursor, passage.length - 1)].keyId;

  return (
    <div className={"drill " + (flash ? "flash-" + flash : "")}>
      {showResult ? (
        <ResultBody title={`${STAGE_LABEL[stage]} complete`} stats={stats}
          warn={result.accuracy < 85 ? "Accuracy under 85% — worth another pass." : null}
          onRestart={restart} isLast={isLast} hasNextLesson={hasNextLesson} onNext={onNext} onExit={onExit} />
      ) : (
        <div className="drill-main">
          <div className="run-top">
            {timed
              ? <span className={"timer" + (timeLeft <= 10 && started ? " timer-low" : "")}>{fmtTime(timeLeft)}</span>
              : <span className="muted">{cursor} / {passage.length}</span>}
            <span className="run-top-right"><span className="muted">{accuracy}% acc</span><GuideToggle on={showGuide} onToggle={onToggleGuide} /></span>
          </div>
          <div className="run-body test-body">
            <div className="tt-passage">
              {slice.map((p, i) => {
                const gi = start + i;
                let cls, ch;
                if (gi < cursor) { cls = "tt-done"; ch = disp(p.keyId, p.pos); }
                else if (gi === cursor && errored) { cls = "tt-error"; ch = errorChar; }
                else if (gi === cursor) { cls = "tt-current"; ch = disp(p.keyId, p.pos); }
                else { cls = "tt-upcoming"; ch = disp(p.keyId, p.pos); }
                return <span key={gi} className={"tt-ch " + cls}>{ch}</span>;
              })}
            </div>
            {errored
              ? <div className="muted tt-hint">⌫ backspace to clear the error</div>
              : !started && <div className="muted tt-hint">{timed ? `Type the sequence — ${TIMED_SECONDS}s clock starts on your first character.` : "Type the whole sequence. No clock."}</div>}
            {showGuide && <FlickGuide keyId={guideKeyId} />}
          </div>
        </div>
      )}
      <textarea ref={inputRef} className="capture" rows={1} autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} placeholder={done ? "press Enter to continue" : "type here…"} aria-label="type the sequence using your kana keyboard" />
    </div>
  );
}

// ---- Result body (shared; rendered inside the run card) -------------------
function ResultBody({ title, stats, warn, onRestart, isLast, hasNextLesson, onNext, onExit }) {
  const label = !isLast ? "Next stage ›" : hasNextLesson ? "Next lesson ›" : "Back to course";
  const action = !isLast ? onNext : hasNextLesson ? onNext : onExit;
  return (
    <div className="run-body summary">
      <div className="summary-title">{title}</div>
      <div className="stat-row">
        {stats.map(([n, l], i) => (
          <div className="stat" key={i}><div className="stat-n">{n}</div><div className="stat-l">{l}</div></div>
        ))}
      </div>
      {warn && <p className="hint-text">{warn}</p>}
      <div className="summary-actions">
        <button className="btn" onClick={onRestart}>Restart</button>
        <button className="btn primary inline" onClick={action}>{label}</button>
      </div>
    </div>
  );
}

// ---- Intro ----------------------------------------------------------------
function Intro({ keyId, onNext }) {
  const k = KEY_BY_ID[keyId];
  const [litPos, setLitPos] = useState(null);
  const inputRef = useRef(null);
  const handlerRef = useRef(() => {});
  const enterRef = useRef(() => {});

  handlerRef.current = () => {
    const el = inputRef.current;
    const raw = el ? el.value : "";
    if (/[\n\r]/.test(raw)) { if (el) el.value = ""; onNext(); return; } // Enter advances
    if (el) el.value = "";
    const val = raw.trim();
    if (!val) return;
    const ch = Array.from(val).pop();
    let found = null;
    for (const pos of POS_ORDER) if (k.dirs[pos].includes(ch)) { found = pos; break; }
    if (found) setLitPos(found);
  };
  enterRef.current = () => onNext();

  useEffect(() => {
    const el = inputRef.current; if (!el) return;
    const onInput = () => handlerRef.current();
    const onKey = (e) => { if (e.key === "Enter") { e.preventDefault(); enterRef.current(); } };
    const onBeforeInput = (e) => { if (e.inputType === "insertLineBreak" || e.inputType === "insertParagraph") { e.preventDefault(); enterRef.current(); } };
    el.addEventListener("input", onInput);
    el.addEventListener("compositionupdate", onInput);
    el.addEventListener("keydown", onKey);
    el.addEventListener("beforeinput", onBeforeInput);
    el.focus();
    return () => {
      el.removeEventListener("input", onInput);
      el.removeEventListener("compositionupdate", onInput);
      el.removeEventListener("keydown", onKey);
      el.removeEventListener("beforeinput", onBeforeInput);
    };
  }, []);

  return (
    <div className="panel">
      <div className="run-body drill-body">
        <div className="intro-key">{k.label}</div>
        {/* <p className="intro-lead">Tap {k.label}; flick the four directions for the rest. Try each one below — it lights up in the guide.</p> */}
        <FlickGuide keyId={keyId} litPos={litPos} />
        <div className="summary-actions">
          <button className="btn primary inline" onClick={onNext}>Next stage ›</button>
        </div>
      </div>
      <textarea ref={inputRef} className="capture" rows={1} autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} placeholder="try a flick…" aria-label="type any character of this key to see it in the guide" />
    </div>
  );
}

// ---- Lesson ---------------------------------------------------------------
function Lesson({ keyId, ks, doneKeyIds, hasNextLesson, onNextLesson, onExit, updateKey }) {
  const [stage, setStage] = useState(ks.lastStage || "intro");
  const [showGuide, setShowGuide] = useState(false); // hidden by default during runs
  const reviewKeyIds = Array.from(new Set([...doneKeyIds.filter((id) => id !== keyId), keyId]));

  useEffect(() => { updateKey(keyId, (prev) => ({ ...prev, lastStage: stage })); }, [stage]);

  const stageIdx = STAGES.indexOf(stage);
  const goNext = () => {
    if (stageIdx + 1 < STAGES.length) setStage(STAGES[stageIdx + 1]);
    else if (hasNextLesson) onNextLesson();
    else onExit();
  };
  const isLast = stageIdx === STAGES.length - 1;
  const onProgress = (snap) => updateKey(keyId, (prev) => ({ ...prev, [stage]: snap }));
  const toggleGuide = () => setShowGuide((g) => !g);

  return (
    <div className="lesson">
      {stage === "intro" ? (
        <Intro keyId={keyId} onNext={goNext} />
      ) : stage === "reps" || stage === "cycle" || stage === "transition" ? (
        <Drill key={stage} stage={stage} keyId={keyId} showGuide={showGuide} onToggleGuide={toggleGuide}
          initial={ks[stage]} isLast={isLast} hasNextLesson={hasNextLesson} onProgress={onProgress} onNext={goNext} onExit={onExit} />
      ) : (
        <TypingTest key={stage} stage={stage} reviewKeyIds={[keyId]} showGuide={showGuide} onToggleGuide={toggleGuide}
          initial={ks[stage]} isLast={isLast} hasNextLesson={hasNextLesson} onProgress={onProgress} onNext={goNext} onExit={onExit} />
      )}

      <div className="nav-row">
        <button className="nav-back" onClick={onExit}>‹ Course</button>
        <div className="stage-tabs">
          {STAGES.map((s) => (
            <button key={s} className={"stage-tab" + (s === stage ? " active" : "")} onClick={() => setStage(s)}>
              {TAB_LABEL[s]}{DRILL_STAGES.includes(s) && stageIsDone(ks, s) && <span className="tabcheck">✓</span>}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---- Home -----------------------------------------------------------------
function Home({ keyData, unlockAll, onPick, onUnlockAll, onReset }) {
  const isUnlocked = (i) => unlockAll || i === 0 || keyIsDone(keyData[KEYS[i - 1].id]);
  return (
    <div className="home">
      <header className="home-head">
        <h1>Kana Flick Trainer</h1>
        <p className="muted">A touch-typing course for the phone kana keyboard. Type on your own keyboard — set it to the Japanese かな (flick) layout first.</p>
      </header>
      <div className="setup-note">Keyboard in <b>Japanese かな</b> mode. Tap a key for its base kana; flick ←↑→↓ for the other four.</div>

      <div className="key-grid">
        {KEYS.map((k, i) => {
          const ks = keyData[k.id];
          const unlocked = isUnlocked(i);
          const done = keyIsDone(ks);
          const started = !done && keyStarted(ks);
          const dn = stagesDoneCount(ks);
          return (
            <button key={k.id} className={"key-card" + (done ? " done" : "") + (started ? " inprog" : "") + (!unlocked ? " locked" : "")}
              disabled={!unlocked} onClick={() => unlocked && onPick(k.id)}>
              <span className="kc-label">{k.label}</span>
              <span className="kc-segs">{DRILL_STAGES.map((s, j) => <span key={j} className={"seg" + (stageIsDone(ks, s) ? " seg-on" : "")} />)}</span>
              <span className="kc-status">{done ? "✓ done" : started ? `in progress ${dn}/${DRILL_STAGES.length}` : unlocked ? "practice" : "locked"}</span>
            </button>
          );
        })}
      </div>

      <div className="testing">
        <span className="testing-label">Testing</span>
        <button className="btn ghost small" onClick={onUnlockAll}>Unlock all keys</button>
        <button className="btn ghost small" onClick={onReset}>Reset progress</button>
      </div>
    </div>
  );
}

// ---- App ------------------------------------------------------------------
function App() {
  const [view, setView] = useState("home");
  const [activeKey, setActiveKey] = useState(null);
  const [keyData, setKeyData] = useState({});
  const [unlockAll, setUnlockAll] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(STORE_KEY);
        if (r && r.value) {
          const d = JSON.parse(r.value);
          if (d.keyData) setKeyData(d.keyData);
          if (typeof d.unlockAll === "boolean") setUnlockAll(d.unlockAll);
        }
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try { await window.storage.set(STORE_KEY, JSON.stringify({ keyData, unlockAll })); } catch (e) {}
    }, 600);
    return () => clearTimeout(saveTimer.current);
  }, [keyData, unlockAll, loaded]);

  const updateKey = useCallback((keyId, patchFn) => {
    setKeyData((prev) => ({ ...prev, [keyId]: patchFn(prev[keyId] || {}) }));
  }, []);

  // Size the run view to the *visible* viewport so the on-screen keyboard
  // (which doesn't shrink vh/dvh units) can't hide the bottom of the page.
  useEffect(() => {
    const root = document.documentElement;
    const vv = window.visualViewport;
    const setVH = () => root.style.setProperty("--vvh", ((vv && vv.height) || window.innerHeight) + "px");
    setVH();
    if (vv) { vv.addEventListener("resize", setVH); vv.addEventListener("scroll", setVH); }
    else { window.addEventListener("resize", setVH); }
    return () => {
      if (vv) { vv.removeEventListener("resize", setVH); vv.removeEventListener("scroll", setVH); }
      else { window.removeEventListener("resize", setVH); }
    };
  }, []);

  // Prevent the document itself from scrolling content under the keyboard.
  useEffect(() => {
    if (view !== "lesson") return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, [view]);

  const doneKeyIds = KEYS.filter((k) => keyIsDone(keyData[k.id])).map((k) => k.id);

  return (
    <div className={"app" + (view === "lesson" ? " run" : "")}>
      <style>{CSS}</style>
      {view === "home" ? (
        <Home keyData={keyData} unlockAll={unlockAll}
          onPick={(id) => { setActiveKey(id); setView("lesson"); }}
          onUnlockAll={() => setUnlockAll(true)}
          onReset={() => { setKeyData({}); setUnlockAll(false); }} />
      ) : (
        <Lesson key={activeKey} keyId={activeKey} ks={keyData[activeKey] || {}} doneKeyIds={doneKeyIds}
          hasNextLesson={KEYS.findIndex((k) => k.id === activeKey) < KEYS.length - 1}
          onNextLesson={() => { const i = KEYS.findIndex((k) => k.id === activeKey); const nx = KEYS[i + 1]; if (nx) setActiveKey(nx.id); else { setView("home"); setActiveKey(null); } }}
          onExit={() => { setView("home"); setActiveKey(null); }} updateKey={updateKey} />
      )}
    </div>
  );
}
